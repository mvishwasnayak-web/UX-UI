<html>
<head>
    <title>Armstrong Number Checker</title>
</head>
<body>
    <h2>Armstrong Number Checker</h2>

    <label>Enter a number:</label>
    <input type="number" id="num">

    <button onclick="checkArmstrong()">Check</button>

    <p id="result"></p>

    <script>
        function checkArmstrong() {
            let num = document.getElementById("num").value;
            let result = document.getElementById("result");

            if (num.trim() === "" || Number(num) < 0 ||
                !Number.isInteger(Number(num))) {
                result.innerHTML = "Please enter a valid non-negative integer.";
                return;
            }

            let original = Number(num);
            let digits = String(original).split("");
            let power = digits.length;
            let sum = 0;

            for (let digit of digits) {
                sum += Number(digit) ** power;
            }

            if (sum === original) {
                result.innerHTML = original +
                    " is an Armstrong number.";
            } else {
                result.innerHTML = original +
                    " is not an Armstrong number.";
            }
        }
    </script>
</body>
</html>
